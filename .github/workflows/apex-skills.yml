name: Apex skills

on:
  pull_request:
    paths:
      - 'agents/apex/**'
      - 'tests/test_apex*'
      - 'tests/test_application_preparation.py'
      - 'tests/test_capel_exact_text.py'
      - 'tests/test_live_vacancy_scan.py'
      - 'tests/test_unesco_skill_install.py'
      - '.github/workflows/apex-skills.yml'
  push:
    branches: [master, main]
    paths:
      - 'agents/apex/**'
      - 'tests/test_apex*'
      - 'tests/test_application_preparation.py'
      - 'tests/test_capel_exact_text.py'
      - 'tests/test_live_vacancy_scan.py'
      - 'tests/test_unesco_skill_install.py'
      - '.github/workflows/apex-skills.yml'

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install helper test dependencies
        run: python -m pip install -r agents/apex/requirements.txt 'pytest>=8,<10' 'PyYAML>=6,<7'
      - name: Run synthetic skill and helper regressions
        run: >-
          python -m pytest -q
          tests/test_apex_named_output_routing.py
          tests/test_apex_v2_scripts.py
          tests/test_application_preparation.py
          tests/test_capel_exact_text.py
          tests/test_live_vacancy_scan.py
          tests/test_unesco_skill_install.py
          tests/test_repo_hygiene.py
          agents/apex/skills/apex-unops-application-fit/tests
          agents/apex/skills/apex-select-domain-of-expertise/tests
          agents/apex/skills/apex-adapt-word-cover-letter/scripts/test_adapt_docx.py
          agents/apex/skills/apex-adapt-word-unu-p11/scripts/test_p11_fields.py
          agents/apex/skills/apex-generate-unesco-employment-history/scripts/test_fill_ehf.py
          agents/apex/skills/apex-match-live-vacancies/scripts/test_preserve_workbook.py
