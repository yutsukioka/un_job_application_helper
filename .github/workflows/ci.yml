name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - repo-unification

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/jobagg[dev]"
          python -m pip install -e "services/job-api[dev]"

      - name: Run tests
        run: |
          (cd packages/jobagg && pytest tests)
          pytest tests

      - name: Validate JSON contracts
        run: |
          python -m json.tool contracts/agents/runtime_config.schema.json >/dev/null

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in list(Path("agents").rglob("*.yaml")) + list(Path("packages").rglob("*.yaml")):
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          PY
