name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - repo-unification

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit ruff hypothesis
          python -m pip install -e "packages/jobagg[dev,browser]"
          python -m pip install -e "services/job-api[dev]"
          python -m pip install -e "packages/vaultsync[dev]"
          python -m pip install -e "services/atlasvault-api[dev]"
          python -m pip install -r agents/apex/job_shortlist_requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: |
          (cd packages/jobagg && pytest tests)
          pytest packages/vaultsync/tests
          pytest tests
          pytest services/job-api/tests reports/jobagg-remediation-plan-2026-09-10/proposed_runner/tests

      - name: Run security gates
        run: |
          bandit -q -r services/job-api/job_api packages/vaultsync/vaultsync packages/jobagg/jobagg/http_safe.py packages/jobagg/jobagg/atomic_files.py packages/jobagg/jobagg/filters/saved_searches.py packages/jobagg/jobagg/pipelines/bundle_verify.py
          pip-audit
          ruff check --select=S --ignore=S104 services/job-api/job_api packages/vaultsync/vaultsync packages/jobagg/jobagg/http_safe.py packages/jobagg/jobagg/atomic_files.py packages/jobagg/jobagg/filters/saved_searches.py packages/jobagg/jobagg/pipelines/bundle_verify.py
          pytest -m security

      - name: Validate JSON contracts
        run: |
          python -m json.tool contracts/agents/runtime_config.schema.json >/dev/null

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in list(Path("agents").rglob("*.yaml")) + list(Path("packages").rglob("*.yaml")):
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          PY
