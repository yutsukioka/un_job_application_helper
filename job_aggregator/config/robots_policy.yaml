default:
  user_agent: "jobagg/0.1 (+https://github.com/yutsukioka/un_job_application_helper/tree/job_aggregator)"
  honor_robots_txt: true
  request_timeout_seconds: 30
  min_delay_seconds: 2.0
  max_pages_per_source: 25
  max_jobs_per_source: 1000

domains:
  # Every host referenced by organizations.yaml should have an explicit entry
  # here so sync behavior does not accidentally depend on the default policy.
  wd3.myworkdaysite.com:
    honor_robots_txt: false
    min_delay_seconds: 2.0
    override_reason: "Personal job-search aggregation; portal robots.txt blanket-blocks scrapers; 2.0s+ per-host delay enforced."

