default:
  user_agent: "jobagg/0.1 (+https://example.invalid/contact)"
  honor_robots_txt: true
  request_timeout_seconds: 30
  min_delay_seconds: 2.0
  max_pages_per_source: 25
  max_jobs_per_source: 1000

