[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultsync"
version = "0.1.0"
description = "Reference encrypted vault format for Atlas multi-device sync."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "un_job_application_helper maintainers" }
]
dependencies = [
  "argon2-cffi>=23.1",
  "cryptography>=42.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vaultsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
