[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagg"
version = "0.1.0"
description = "Python CLI for aggregating job postings across ATS platform families."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "un_job_application_helper maintainers" }
]
dependencies = [
  "PyYAML>=6.0.1"
]

[project.optional-dependencies]
discovery = [
  "playwright>=1.45"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
jobagg = "jobagg.scheduler:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobagg*"]

[tool.setuptools.package-data]
jobagg = [
  "classification/rules/*.yaml",
  "classification/rules/*.csv",
  "classification/rules/*.json",
  "classification/rules/taxonomies/*.yaml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
