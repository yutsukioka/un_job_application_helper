at Assessments","url":"\/publications-events\/other-reports\/other-threat-assesments"}]},{"id":183,"name":"Events","url":"\/publications-events\/events"},{"id":170,"name":"Public Register","url":"\/publications-events\/public-register"},{"id":181,"name":"Public Access to Europol documents","url":"\/publications-events\/public-access-to-europol-documents"},{"id":182,"name":"Request Access to Europol documents","url":"\/publications-events\/request-access"}]}]},"blocks":{"empact":"<div class=\"full-color color-grey-light\">\r\n<div class=\"row\">\r\n<div class=\"columns large-3\">\r\n<p>The European Multidisciplinary Platform Against Criminal Threats (<a href=\"https:\/\/www.europol.europa.eu\/crime-areas-and-statistics\/empact\">EMPACT<\/a>) tackles the most important threats posed by organised and serious international crime affecting the EU. EMPACT strengthens intelligence, strategic and operational cooperation between national authorities, EU institutions and bodies, and international partners. EMPACT runs in four-year cycles focusing on common EU crime priorities.<\/p>\r\n<\/div>\r\n\r\n<div class=\"columns large-9\">\r\n<p>&nbsp;<\/p>\r\n<\/div>\r\n<\/div>\r\n<\/div>\r\n","footer-top":"<h2 class=\"show-for-sr\">Email alerts.<\/h2><p>Subscribe to receive an email when we publish a press release, document, vacancy or internship.<\/p><div><a class=\"button large orange\" href=\"\/newsletter\/subscriptions\">Manage your email alerts<\/a><\/div>","footer-bottom-first":"<p>\u00a9 European Union Agency for Law Enforcement Cooperation 1999-2026<\/p><p>Any use of Europol\u2019s logo requires prior written consent.<\/p>","footer-bottom-second":"<h2 class=\"show-for-sr\">Quick Links.<\/h2>\r\n\r\n<div class=\"inline-links\"><a class=\"button turquoise\" href=\"\/report-a-crime\">Report a Crime<\/a> <a class=\"button turquoise\" href=\"\/faq\">FAQ<\/a> <a class=\"button turquoise\" href=\"https:\/\/ec.europa.eu\/eusurvey\/runner\/eus_europol_added_value\" target=\"_blank\">User feedback survey<\/a><\/div>\r\n\r\n<ul class=\"turquoise\">\r\n\t<li><a href=\"\/legal-notice\">Legal notice<\/a><\/li>\r\n\t<li><a href=\"\/cookies\">Cookies<\/a><\/li>\r\n\t<li><a href=\"\/right-of-access\">Right of access<\/a><\/li>\r\n\t<li><a href=\"\/processing-of-personal-data\">Processing of personal data<\/a><\/li>\r\n\t<li><a href=\"\/partners-collaboration\/justice-and-home-affairs-jha-agencies-network\">Justice and Home Affairs (JHA) agencies\u2018 network<\/a><\/li>\r\n<\/ul>","footer-bottom-third":"<h2 class=\"show-for-sr\">Follow us.<\/h2><ul><li class=\"rss\" data-list-item-id=\"e0eb9932d0f27609721d798cc62f88aa9\"><a href=\"https:\/\/www.europol.europa.eu\/rss.xml\">RSS<\/a><\/li><li class=\"instagram\" data-list-item-id=\"e3dfd6f24119e1428934561f88befe924\"><a href=\"https:\/\/www.instagram.com\/europol.eu\/\">Instagram<\/a><\/li><li class=\"linkedIn\" data-list-item-id=\"eade2fceab1219ec44f02bfb263bb4d23\"><a href=\"https:\/\/www.linkedin.com\/company\/europol\/\">LinkedIn<\/a><\/li><li class=\"facebook\" data-list-item-id=\"ea12796f86462358471ba06a3f680696c\"><a href=\"https:\/\/www.facebook.com\/europol\">Facebook<\/a><\/li><li class=\"bluesky\" data-list-item-id=\"e5f8f69ac665737032deed9b3a2c7981d\"><a href=\"https:\/\/bsky.app\/profile\/europol.europa.eu\">Bluesky<\/a><\/li><li class=\"youTube\" data-list-item-id=\"e6fa1bd664bdf315fb2461089e5a4e80e\"><a href=\"https:\/\/www.youtube.com\/user\/EUROPOLtube\">YouTube<\/a><\/li><\/ul>","child-abuse-privacy":"<p>Europol is committed to user privacy. All personal data collected by Europol are processed in accordance with the provisions of Regulation (EU) 2018\/1725 of the European Parliament and of the Council of 23 October 2018 on the protection of natural persons with regard to the processing of personal data by the Union institutions, bodies, offices and agencies and on the free movement of such data, and repealing Regulation (EC) No 45\/2001 and Decision No 1247\/2002\/EC. We will handle all the information received from you confidentially. Confidentiality implies that your personal data will be disclosed only to authorised personnel of Europol. However, it may be necessary for the future investigation to inform the national competent authority concerned about the content of the information received from you and\/or your identity.<\/p>\r\n","newsletter-subscription-sidebar-footer":"<p><a href=\"\/newsletter\/subscriptions\/manage\">Already a subscriber? Manage your subscription.<\/a><\/p>"},"terms":{"tags":[],"languages":[{"id":362,"title":"Bulgarian"},{"id":579,"title":"Gaelic"},{"id":574,"title":"Icelandic"},{"id":557,"title":"Luxembourgish"},{"id":580,"title":"Macedonian"},{"id":515,"title":"Norwegian"},{"id":516,"title":"Russian"},{"id":517,"title":"Ukranian"},{"id":363,"title":"Spanish"},{"id":364,"title":"Czech"},{"id":365,"title":"Danish"},{"id":366,"title":"German"},{"id":367,"title":"Estonian"},{"id":368,"title":"Greek"},{"id":369,"title":"English"},{"id":370,"title":"French"},{"id":371,"title":"Irish"},{"id":372,"title":"Italian"},{"id":373,"title":"Latvian"},{"id":374,"title":"Lithuanian"},{"id":375,"title":"Hungarian"},{"id":376,"title":"Maltese"},{"id":377,"title":"Dutch"},{"id":378,"title":"Polish"},{"id":379,"title":"Portuguese"},{"id":380,"title":"Romanian"},{"id":381,"title":"Slovak"},{"id":382,"title":"Slovene"},{"id":383,"title":"Finnish"},{"id":384,"title":"Swedish"},{"id":385,"title":"Croatian"},{"id":386,"title":"Other"}]}},"NodeLoader":{"node":{"id":1080,"type":"vacancy","title":"Head of Unit \u2013 Operational Centre","applicationUrl":"https:\/\/emea3.recruitmentplatform.com\/apply-app\/pages\/application-form?jobId=QJ4FK026203F3VBQB8NV4LOD7-1080&langCode=en_GB","restricted":true,"restrictedAnnex":false,"internship":false,"published":1786917600,"deadline":1789423199,"updated":1786978142,"referenceNumber":"Europol\/2026\/TA\/AD9\/769","body":"<p style=\"text-align: justify;\"><em>This selection procedure is intended to fill 1 currently available post.<\/em><\/p>\n<p style=\"text-align: justify;\"><em>Europol retains the right to make use of the reserve list to select candidates for similar posts within the organisation, should business needs require so.<\/em><\/p>\n<p style=\"text-align: justify;\"><strong>1. Organisational Context<\/strong><br><strong>Organisational setting:<\/strong><\/p>\n<p style=\"text-align: justify;\">The post of Head of Unit \u2013 Operational Centre is located in the Operational and Analysis Centre (OAC), Operations Directorate.<br>The Operations Directorate hosts the following distinct Departments: Operational and Analysis Centre, European Serious Organised Crime Centre, European Cyber Crime Centre, European Counter Terrorism Centre, European Financial and Economic Crime Centre and European Centre Against Migrant Smuggling.\u00a0<br>The Operations Directorate deals with the core business of Europol, improving the effectiveness and cooperation of the competent authorities in the Member States in preventing and combating serious and organised crime, as well as terrorism affecting the Member States (MS). This requires close cooperation with the Liaison Bureaux at Europol and via them with the Operational Teams in the Member States.\u00a0<br>Europol delivers a number of products and services to national law enforcement agencies to support them in their fight against international serious and organised crime, as well as terrorism.\u00a0<\/p>\n<p style=\"text-align: justify;\">The Operational and Analysis Centre delivers support across the Operations Directorate by delivering added value to all Centres, including several functions of operational and strategic nature:<br>\u2022 \u00a0 \u00a0Information hub and 24\/7 Operational support;<br>\u2022 \u00a0 \u00a0Travel intelligence;<br>\u2022 \u00a0 \u00a0Integrated Operational Services<br>\u2022 \u00a0 \u00a0EMPACT support;<br>\u2022 \u00a0 \u00a0Liaison and Stakeholder coordination;<br>\u2022 \u00a0 \u00a0Strategic analysis;<br>\u2022 \u00a0 \u00a0Data analysis Development;\u00a0<br>\u2022 \u00a0 \u00a0Analysis Training.<\/p>\n<p style=\"text-align: justify;\">The main tasks of the Operational Centre Unit are:<\/p>\n<p style=\"text-align: justify;\">\u2022 \u00a0 \u00a0Ensures 24\/7 availability and monitoring of information exchange;<br>\u2022 \u00a0 \u00a0Provides operational support to Europol\u2019s Operational Centres (including processing, crosschecking and handling cases);<br>\u2022 \u00a0 \u00a0Initiates immediate actions and crisis response mechanisms;<br>\u2022 \u00a0 \u00a0Supports major events and operations;<\/p>\n<p style=\"text-align: justify;\"><strong>Purpose of the post:<\/strong><\/p>\n<p style=\"text-align: justify;\">The Head of the Operational Centre Unit is responsible for the effective discharge of his\/her responsibilities under the supervision of the Head of the relevant Department. \u00a0<br>This includes close contact with Heads of Teams and Specialists\/Analysts as well as external counterparts in order to identify opportunities for operational support and to enhance operational cooperation and live information exchange with competent authorities in MS and Third Countries.\u00a0<\/p>\n<p style=\"text-align: justify;\"><strong>Reporting lines:<\/strong><\/p>\n<p style=\"text-align: justify;\">The incumbent reports to the Head of the Operational and Analysis Centre (OAC) Department.<\/p>\n<p style=\"text-align: justify;\"><strong>Job environment:<\/strong><\/p>\n<p style=\"text-align: justify;\">This post might require participation in a shift system including weekends and nights as well as on-call duty.<\/p>\n<p style=\"text-align: justify;\"><strong>2. \u00a0Functions and duties<\/strong><br>The successful candidate will have to carry out the following main duties:<br>\u2022 Set vision, goals and objectives for the Unit in alignment with Europol\u2019s organisational strategy and inspire staff;<br><br><\/p><p style=\"text-align: justify;\">\u2022 Develop and implement policies and procedures to facilitate seamless operations and ensure compliance with relevant legal framework and fundamental rights outlined in the Charter of Fundamental Rights of the European Union;<br>\u2022 Manage the delivery of relevant products and services included in the Europol work programme; ensure the quality and timeliness of the products and services delivered;<br>\u2022 Manage staff within the Unit; establish and monitor the achievement of key performance indicators and identify and address areas for improvement; provide constructive feedback, guide and empower staff in order to grow and develop;<br>\u2022 Ensure the effective management and efficient use of all financial, human and other resources, in support of Europol's program delivery; identify risks and ensure appropriate mitigation; <br>\u2022 Manage conflicts by effectively applying techniques and strategies that identify and address conflicts early and to find satisfactory solutions that promote positive outcomes;<br>\u2022 Ensure that data entrusted to the unit are protected and used in accordance with the relevant Europol regulations;<br>\u2022 Cultivate a culture of teamwork and cooperation with zero tolerance for harassment; put into place effective communication and collaboration between the Unit and other Units\/stakeholders inside or outside of Europol; <br>\u2022 Make development opportunities available and ensure staff members have the know-how, resources, environment and support necessary to achieve results in an effective manner;<br>\u2022 Represent the Unit in external and cross-departmental engagements and negotiations and provide advice on matters relating to area of responsibility; deliver presentations and prepare reports;<br>\u2022 Act as role model for the Unit and champion diversity and inclusion matters inside and outside Europol;<br>\u2022 Perform any other duties in the area of competence as assigned by the line management.<\/p>\n<p style=\"text-align: justify;\"><strong>3. Requirements - Eligibility criteria<\/strong><br><strong>a. Candidates must<\/strong><br>\u2022 Be a member of a competent authority within the meaning of the Article 2(a) of the Europol Regulation and enjoy full rights as a citizen of a Member State;<br>\u2022 Have fulfilled any obligations imposed by the applicable laws on military service;<br>\u2022 Produce appropriate character references as to his or her suitability for the performance of the duties;<br>\u2022 Be physically fit to perform the duties pertaining to the post as further specified in Article 13 of the Conditions of Employment of Other Servants of the European Union (CEOS);<br>\u2022 Produce evidence of a thorough knowledge of one of the languages of the Union and a satisfactory knowledge of another language of the Union to the extent necessary for the performance of the duties.<\/p>\n<p style=\"text-align: justify;\"><strong>b. Candidates must have<\/strong><br>\u2022 A level of education which corresponds to completed university studies attested by a diploma when the normal period of university education is four years or more; <br><strong>OR <\/strong><br>\u2022 A level of education which corresponds to completed university studies attested by a diploma and appropriate professional experience of at least one year when the normal period of university education is three years; <br><strong>OR<\/strong><br>\u2022 Professional training of an equivalent level in a relevant area (e.g., Police Officer\u2019s School) and after having completed the training, at least the number of years of relevant professional experience as indicated below:<\/p>\n<p>Duration of professional training Additional professional experience required for equivalency<br><br><\/p><p>More than 6 months and up to 1 year - 4 years<br>More than 1 year and up to 2 years - 3 years<br>More than 2 years and up to 3 years - 2 years<br>More than 3 years - 1 year<\/p>\n<p>\u2022 In <strong>addition<\/strong> to the above at least <strong>12 years<\/strong> of professional work experience gained after the award of the diploma.<\/p>\n<p><strong>4. Requirements - Selection criteria<\/strong><br><strong>a) Professional experience:<\/strong><br><strong>Essential: <\/strong><br>\u2022 Experience in leading or coordinating law enforcement operations, with a strong focus on data handling, data management and operational data processing;<br>\u2022 Experience in leading the planning, coordination, and delivery of law enforcement activities, particularly in relation to data processing, information flows and the handling of operational information;<br>\u2022 Experience in liaison, coordination, and cooperation with internal and external stakeholders regarding operational activities, information exchange, data-sharing processes, and operational collaboration, <br>\u2022 Experience in managing staff of at least 5 years;<br>\u2022 Experience with administration, finances and planning at management level; <br>\u2022 Experience working in a multicultural environment.<br><strong>Desirable:<\/strong><br>\u2022 Experience in project and\/or change management.<\/p>\n<p><strong>b) Professional knowledge:<\/strong><br><strong>Essential:<\/strong><br>\u2022 Sound knowledge of Europol\u2019s legal framework and the EU internal security architecture, particularly with regard to data management, data processing and operational information exchange;<br>\u2022 Sound knowledge of the EU legal and regulatory framework relevant to law enforcement cooperation and operational activities;<br>\u2022 Knowledge of the implementation and use of innovative and advanced technologies for data management and operational support;<br>\u2022 Knowledge of international law enforcement cooperation frameworks, regulations, procedures, and best practices, including collaboration with national, EU, and international partners.<\/p>\n<p><strong>c) General management skills, including:<\/strong><br><strong>Essential:<\/strong><br>\u2022 The ability to set and revise objectives for the unit within the overall strategic framework and priorities of the Agency;<br>\u2022 The ability to determine and focus on priorities and to monitor and evaluate the progress made towards achieving the Department\u2019s and Units\/Team members\u2019 objectives set, in cooperation with managers;<br>\u2022 The ability to organise, assign and manage the Department\u2019s work among the members of the Units\/Teams and to set them challenging but realistic objectives;<\/p>\n<p>\u2022 The ability to empower members of the Units and Teams while ensuring that they understand what is expected of them and how their work contributes to the unit\u2019s objectives;<br>\u2022 The ability to choose co-workers and to build strong teams with complementary strengths suited to the efficient pursuit of the Department\u2019s objectives;<br>\u2022 The ability to motivate members of the team to achieve the desired results and also to provide regular feedback, acknowledge success and the need for improvement in order to enable them to achieve their objectives and greatest potential;<br>\u2022 The ability to develop and support career development and learning opportunities for the members of the team.<\/p>\n<p><strong>Communication skills<\/strong><br>\u2022 The ability to communicate clearly and present complex subjects simply, both orally and in writing, including to the members of the team;<br>\u2022 The ability to solicit inputs from and listen to staff, partners, and stakeholders.<\/p>\n<p><strong>Interpersonal skills<\/strong><br>\u2022 The ability to deal with people effectively, respectfully and courteously;<\/p><p style=\"text-align: justify;\">\u2022 The ability to build productive and cooperative working relationships with hierarchy and other units and colleagues.<\/p>\n<p style=\"text-align: justify;\"><strong>Negotiation skills<\/strong><br>\u2022 The ability to steer discussions and generate the best possible results without compromising productive working relationships with the other parties involved.<br><strong>d) Fulfil the condition stipulated in Article 5 of the Decision of the Executive Director on the Duration of contracts of employment for Temporary Agents, on the start date of the possible contract of employment which may be offered.<\/strong><\/p>\n<div style=\"text-align: justify;\"><strong>5. Selection procedure<\/strong><\/div>\n<div style=\"text-align: justify;\">All applications for Temporary Agent posts must be submitted through the online recruitment system accessible via Europol\u2019s website. For further information, please consult the Europol Recruitment Guidelines.<\/div>\n<div style=\"text-align: justify;\">The stages to be followed by the AACC shall be as follows:<\/div>\n<div style=\"text-align: justify;\">1) Pre-selection\u00a0<\/div>\n<div style=\"text-align: justify;\">The Executive Director sets up a Pre-selection Panel composed of at least three members, of a grade and management function equal or superior to that of the function to be filled, consisting of one chair and at least one member from the administration of Europol and one member designated by the Staff Committee. Where there are no TAs within Europol fulfilling the requirement of management function and grade, the AACC may decide to designate officials or TAs from another agency or institution who fulfil that condition.<\/div>\n<div style=\"text-align: justify;\"><span><strong> For restricted posts,<\/strong> the Executive Director shall designate up to two additional members of the Pre-selection Panel if so requested by the Chairperson of the Management Board. The additional members shall consist of a representative of the Presidency or one representative of the Presidency and one representative of another Member State. The Executive Director may invite other persons to the Pre-selection panel as observers.\u00a0<\/span><\/div>\n<div style=\"text-align: justify;\">The minimum pass-mark for being shortlisted, i.e., invited to participate in a pre-selection, is established as 60% of the total maximum score. The Pre-selection panel draws up a shortlist with a maximum of 6 candidates who most correspond to the profile sought. All candidates having a score equal to the 6th highest scoring candidate will be included in the list of shortlisted candidates invited to participate in the pre-selection.<\/div>\n<div style=\"text-align: justify;\">In case of candidates shortlisted for <strong>restricted<\/strong> posts <strong>(including restricted - Annex II posts),<\/strong> who had indicated membership of a competent authority in one of the Member States, Europol will seek confirmation from the relevant Europol National Unit to ensure that those candidates indeed belong to a competent authority<\/div>\n<div style=\"text-align: justify;\">The pre-selection shall rely on one or more written and oral test(s).<\/div>\n<div style=\"text-align: justify;\">The Pre-selection Panel establishes the minimum pass-mark for the pre-selection. Only candidates scoring above the pass-mark for the Pre-selection will be invited to take part in an Assessment Centre and interview with an Interview Panel.<\/div>\n<div style=\"text-align: justify;\">The selection criteria, set out in this Vacancy Notice, will be assessed throughout the different stages of the selection procedure. Before the start of the selection procedure, it will be decided which selection criteria will be used at each stage of the selection procedure. Certain selection criteria will be assessed only for shortlisted candidates during written test(s), and\/or interview(s) and\/or an Assessment Centre.<\/div><p style=\"text-align: justify;\">It is intended for the pre-selection and interviews to be conducted on-site at Europol. Should it be necessary to conduct the pre-selection and\/or interviews remotely, either in part or in full, in the interest of the proceedings, the candidates invited to participate in the pre-selection and\/or interviews will be informed accordingly.<br>2) \u00a0 \u00a0Assessment Centre<br>All candidates invited to the interviews with the Executive Director shall take part in an Assessment Centre, unless they have already taken part in such an Assessment Centre in the course of the year preceding the Assessment Centre. If a candidate has taken part in an Assessment Centre within this period, Europol may decide to waive the requirement to repeat the assessment.<\/p>\n<p style=\"text-align: justify;\">The Assessment Centre evaluates, through a series of group and individual exercises and activities and in-depth interviews focused on management skills, whether the candidates possess the competencies required. Assessment Centres are conducted by an external provider. The result of the Assessment Centre shall be taken into consideration by the Executive Director.<br>3) \u00a0 \u00a0Interview\u00a0<br>The candidates scoring above the pass mark in the pre-selection shall be invited to an interview with the Executive Director and two members of a grade and management function equal or superior to that of the function to be filled.<\/p>\n<p style=\"text-align: justify;\"><strong>For restricted posts,<\/strong> the Interview Panel shall consist of up to two additional members if so requested by the Chairperson of the Management Board. The additional members shall consist of a representative of the Presidency or one representative of the Presidency and one representative of another Member State.\u00a0<br>After all stages of the selection procedure have taken place, the AACC makes a decision of appointment.\u00a0<br>The AACC retains the discretion to constitute a Reserve List. A Reserve List is valid for 24 months. The list of selection procedures for which reserve lists have been established is accessible on Europol\u2019s <a href=\"https:\/\/www.europol.europa.eu\/work-with-us\/careers\/open-vacancies\">website<\/a>.<br>Candidates who attend the selection procedure will be informed of the outcome and\/or whether they have been placed on the reserve list.\u00a0<br><strong>General provisions<\/strong><br>The work and deliberations of the Pre-Selection and Interview Panels are confidential. It is forbidden for candidates to make direct or indirect contact with the members of the Panels or for anyone to do so on their behalf.<br>All enquiries related to a selection procedure should be addressed to the Europol HR Operational Support Team at the following email address: <a href=\"https:\/\/www.europol.europa.eu\/work-with-us\/careers\/open-vacancies\">C2-12@europol.europa.eu<\/a>. Detailed information on the selection procedure- including enquiries, measures of redress and their applicable deadlines is available in the Europol Recruitment Guidelines, which can be found on Europol\u2019s <a href=\"website%20www.europol.europa.eu\">website www.europol.europa.eu<\/a>.<\/p>\n<p style=\"text-align: justify;\"><strong>6. Compensation and benefits<\/strong><br><strong>Scale: AD9<\/strong><br>The basic monthly salary is EUR <strong>10,082.77<\/strong> (step 1) or EUR <strong>10,506.46 <\/strong>(step 2).\u00a0<br>The step in grade is determined on the basis of professional experience gained after the education required for the position and in line with applicable implementing rules.\u00a0<br>Staff pay EU tax at source but salaries are exempt from national taxes. Compulsory deductions are made for medical insurance, pension and unemployment insurance. \u00a0<\/p>\n<p style=\"text-align: justify;\">\u00a0<\/p><p style=\"text-align: justify;\">Subject to the applicable conditions being met, as defined in the EU Staff Regulations (EUSR)\/CEOS and further specified in the case law of the Court of Justice of the European Union, allowances such as expatriation allowance (16% of basic gross salary) or foreign residence allowance (4% of basic gross salary), household allowance, dependent child and \/ or education allowance may be granted. \u00a0<br>Staff enjoy worldwide insurance coverage by the Joint Sickness Insurance Scheme (JSIS) and are insured against sickness, the risk of occupational disease and accident.<br>Europol offers flexible working arrangements, a comprehensive provision for annual leave as well as parental leave supporting a healthy work-life balance.<br>Indicative net salary sample calculation AD9\/1:<br>a) Staff member (single) in receipt of expatriation allowance (16%): EUR <strong>10,048.93<\/strong>\u00a0<br>b) Staff member with two dependent children in their custody in receipt of expatriation allowance (16%): EUR <strong>12,573.89<\/strong><br>The above information is indicative and for information purposes only. It is merely meant to give an indication of your possible net salary in light of the currently applicable amounts of the related allowances and the level of taxation. It has no legal value and no rights can be derived from it. \u00a0<br>The information is based on figures applicable as of July 2025.\u00a0<\/p>\n<p style=\"text-align: justify;\"><strong>7. \u00a0 \u00a0 Terms and conditions<\/strong><br><strong>Contract of employment<\/strong><br>The successful candidate will be recruited in the type of post Head of Unit or equivalent, grade AD9 pursuant to Article 2(f) CEOS and Annex I EUSR.<br>The initial contract will be concluded for a period of 5 years (full-time \u2013 40 hours a week). The contract may be renewed only once, in principle, for a period of 5 years.\u00a0<br>The overall duration of the contracts on restricted posts of Europol staff members will be taken into account if they are successful in the selection procedure. \u00a0<\/p>\n<p style=\"text-align: justify;\"><strong>Conditions of engagement<\/strong><br>Before the employment contract is concluded by Europol, the successful candidate will have to:<br>\u2022 declare any conflict of interest;<br>\u2022 undergo a pre-employment medical examination to confirm that he\/she is physically fit to perform the duties pertaining to the post or, alternatively, receive the confirmation from Europol that he\/she fulfils the conditions laid down in the Decision of the Deputy Executive Director of the Capabilities Directorate on the pre-employment medical examination available on www.europol.europa.eu;<br>\u2022 in case of candidates for restricted posts <strong>(including restricted - Annex II posts) <\/strong>who had indicated membership of a competent authority in one of the Member States, provide confirmation of his\/her membership of a competent authority in one of the Member States within the meaning of the Article 2(a) of the Europol Regulation.<\/p>\n<p style=\"text-align: justify;\">The place of employment will be The Hague, The Netherlands.\u00a0<br>For further information on terms and conditions, please consult the EUSR\/CEOS available on www.europol.europa.eu.<br><strong>Probation period<\/strong><br>Engagement for this post is subject to the successful completion of a probationary period of 9 months.\u00a0<br>Europol reserves the right to terminate the contract of employment during or at the end of the probation period in accordance with Article 14 of CEOS.<br><strong>Trial period<\/strong><br>All newly appointed heads of unit shall serve a management trial period of nine months as a \u2018probationer head of unit\u2019, unless they have already successfully passed such a management trial period in a previous function in the EU institutions as referred to in Article 1(a), paragraph 2, of the EUSR.<\/p><p style=\"text-align: justify;\">This trial period shall provide a formal opportunity to make a definite judgement as to whether the temporary staff has the necessary managerial ability and can remain in this function.\u00a0<\/p>\n<p style=\"text-align: justify;\"><strong>Security screening and certificate of good conduct<\/strong><br>Candidates who have been recruited to a post at Europol are required to furnish a valid certificate of good conduct before the start of their employment. The certificate of good conduct must be provided to Europol prior to the signature of the employment contract. The certificate of good conduct must be issued by the relevant authorities of the country of nationality of the candidate and must not be older than three months at the time of submission to Europol. Europol reserves the right not to proceed with the signature of the contract based on the content of the certificate or if the candidate fails to provide the certificate to Europol.\u00a0<br>The certificate of good conduct does not substitute a valid security clearance required for all Europol staff at the level indicated in the vacancy notice. Failure to obtain the requisite security clearance may be cause for termination of the employment contract.<br>Candidates who currently hold a valid security clearance at the level indicated in the vacancy notice or above do not need to obtain a certificate of good conduct or a new security clearance and must provide a copy of the current security clearance certificate to Europol prior to the signature of the employment contract. Europol shall verify and confirm the continued validity of the security clearance. In case Europol determines that the security clearance is not valid, the candidate will be required to provide a valid certificate of good conduct prior to the signature of the employment contract. Europol may at any time terminate the employment contract if the result of the security screening is not positive and the necessary clearance level is not granted or extended.\u00a0<br>The requested level of security clearance for this post is: <strong>SECRET UE\/EU SECRET.\u00a0<\/strong><\/p>\n<p style=\"text-align: justify;\"><strong>8.\u00a0 Additional information<\/strong><br><strong>Equal opportunity<\/strong><br>Europol is an equal opportunity employer. Europol accepts applications without distinction on grounds of gender, sexual orientation, national, ethnic or social origin, religion or beliefs, family situation, age, disability, or other non-merit factors. All employment decisions are based on business needs, job requirements and qualifications, experience and skills.<\/p>\n<p style=\"text-align: justify;\">Europol lives diversity and provides an inclusive work environment to all. Europol strives to recruit, develop and retain a diverse and talented workforce through application of equal opportunity and impartiality.<\/p>\n<p style=\"text-align: justify;\"><strong>Privacy Notice<\/strong><br>Regulation (EU) 2018\/1725 of the European Parliament and of the Council of 23 October 2018 on the protection of natural persons with regard to the processing of personal data by the Union institutions, bodies, offices and agencies and on the free movement of such data, and repealing Regulation (EC) No 45\/2001 and Decision No 1247\/2002\/EC, applies to the processing of personal data carried out in the process of selection and recruitment of staff at Europol, following the application of this Regulation to all administrative personal data held by Europol in accordance with Article 27a of the Europol Regulation.<\/p>\n<p style=\"text-align: justify;\">For additional information, please consult the applicable privacy notice available on Europol\u2019s <a href=\"https:\/\/www.europol.europa.eu\/work-with-us\/careers\/types-of-contracts\/temporary-agents-and-contract-agents\">website<\/a>, also inserted in the EUROPOL RECRUITMENT GUIDELINES.\u00a0<\/p><p style=\"text-align: justify;\"><strong>Statutory obligations upon leaving the service<\/strong><\/p>\n<p style=\"text-align: justify;\">Pursuant to Article 16 of the EUSR, EU officials and, by analogy, temporary agents, continue to be bound by the duty to behave with integrity and discretion as regards the acceptance of certain appointments or benefits after leaving the service. Those staff members intending to engage in an occupational activity within two years of leaving the service shall inform their institution, so that it may take an appropriate decision in that respect. In cases where the intended activity is related to the work carried out by the staff member during the last three years of service and could lead to a conflict with the legitimate interests of the institution, the decision to be taken may include forbidding the staff member from undertaking it or giving its approval subject to any conditions it thinks fit.<br><strong>Main dates<\/strong><br>Publication date: \u00a0 \u00a0 \u00a0 \u00a0<strong>17 August 2026<\/strong><br>Deadline for application: \u00a0 \u00a0<strong>14 September 2026, 23:59 Amsterdam Time Zone<\/strong><br>Recruitment procedure: \u00a0 <strong>\u00a0October \u2013 December 2026.<\/strong><\/p>\n<p style=\"text-align: justify;\"><strong>Application process and selection procedure \u00a0 \u00a0<\/strong><br>For further details on the application process and the selection procedure, please consult our FAQs or refer to the EUROPOL RECRUITMENT GUIDELINES available on Europol\u2019s website.<\/p>\n<p style=\"text-align: justify;\"><strong>Contact details<\/strong><br>For further details on the application process please call +31 (0) 70 302 5066 or\u00a0<br>+31 (0) 70 302 5022.<\/p>\n<p style=\"text-align: justify;\">\u00a0<\/p>","reportTo":"The Head of the Operational and Analysis Centre (OAC) Department","contractTypeGroup":"Temporary Agents","contractType":"Restricted Temporary Agent","postType":"Restricted","department":"O1  Operational and Analysis Centre (OAC)","alias":"\/work-with-us\/careers\/open-vacancies\/vacancy\/1080"}}};</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","@id":"https://www.europol.europa.eu/#organization","name":"Europol","url":"https://www.europol.europa.eu","logo":"https://www.europol.europa.eu/logo-share.png"}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","@id":"https://www.europol.europa.eu/#website","url":"https://www.europol.e
