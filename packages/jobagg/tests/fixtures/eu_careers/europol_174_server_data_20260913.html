ame":"Europol in Brief","url":"\/publications-events\/other-reports\/europol-in-brief"},{"id":179,"name":"Other Threat Assessments","url":"\/publications-events\/other-reports\/other-threat-assesments"}]},{"id":183,"name":"Events","url":"\/publications-events\/events"},{"id":170,"name":"Public Register","url":"\/publications-events\/public-register"},{"id":181,"name":"Public Access to Europol documents","url":"\/publications-events\/public-access-to-europol-documents"},{"id":182,"name":"Request Access to Europol documents","url":"\/publications-events\/request-access"}]}]},"blocks":{"empact":"<div class=\"full-color color-grey-light\">\r\n<div class=\"row\">\r\n<div class=\"columns large-3\">\r\n<p>The European Multidisciplinary Platform Against Criminal Threats (<a href=\"https:\/\/www.europol.europa.eu\/crime-areas-and-statistics\/empact\">EMPACT<\/a>) tackles the most important threats posed by organised and serious international crime affecting the EU. EMPACT strengthens intelligence, strategic and operational cooperation between national authorities, EU institutions and bodies, and international partners. EMPACT runs in four-year cycles focusing on common EU crime priorities.<\/p>\r\n<\/div>\r\n\r\n<div class=\"columns large-9\">\r\n<p>&nbsp;<\/p>\r\n<\/div>\r\n<\/div>\r\n<\/div>\r\n","footer-top":"<h2 class=\"show-for-sr\">Email alerts.<\/h2><p>Subscribe to receive an email when we publish a press release, document, vacancy or internship.<\/p><div><a class=\"button large orange\" href=\"\/newsletter\/subscriptions\">Manage your email alerts<\/a><\/div>","footer-bottom-first":"<p>\u00a9 European Union Agency for Law Enforcement Cooperation 1999-2026<\/p><p>Any use of Europol\u2019s logo requires prior written consent.<\/p>","footer-bottom-second":"<h2 class=\"show-for-sr\">Quick Links.<\/h2>\r\n\r\n<div class=\"inline-links\"><a class=\"button turquoise\" href=\"\/report-a-crime\">Report a Crime<\/a> <a class=\"button turquoise\" href=\"\/faq\">FAQ<\/a> <a clas  movement of such data, and repealing Regulation (EC) No 45\/2001 and Decision No 1247\/2002\/EC. We will handle all the information received from you confidentially. Confidentiality implies that your personal data will be disclosed only to authorised personnel of Europol. However, it may be necessary for the future investigation to inform the national competent authority concerned about the content of the information received from you and\/or your identity.<\/p>\r\n","newsletter-subscription-sidebar-footer":"<p><a href=\"\/newsletter\/subscriptions\/manage\">Already a subscriber? Manage your subscription.<\/a><\/p>"},"terms":{"tags":[],"languages":[{"id":362,"title":"Bulgarian"},{"id":579,"title":"Gaelic"},{"id":574,"title":"Icelandic"},{"id":557,"title":"Luxembourgish"},{"id":580,"title":"Macedonian"},{"id":515,"title":"Norwegian"},{"id":516,"title":"Russian"},{"id":517,"title":"Ukranian"},{"id":363,"title":"Spanish"},{"id":364,"title":"Czech"},{"id":365,"title":"Danish"},{"id":366,"title":"German"},{"id":367,"title":"Estonian"},{"id":368,"title":"Greek"},{"id":369,"title":"English"},{"id":370,"title":"French"},{"id":371,"title":"Irish"},{"id":372,"title":"Italian"},{"id":373,"title":"Latvian"},{"id":374,"title":"Lithuanian"},{"id":375,"title":"Hungarian"},{"id":376,"title":"Maltese"},{"id":377,"title":"Dutch"},{"id":378,"title":"Polish"},{"id":379,"title":"Portuguese"},{"id":380,"title":"Romanian"},{"id":381,"title":"Slovak"},{"id":382,"title":"Slovene"},{"id":383,"title":"Finnish"},{"id":384,"title":"Swedish"},{"id":385,"title":"Croatian"},{"id":386,"title":"Other"}]}},"NodeLoader":{"node":{"id":1081,"type":"vacancy","title":"Senior Agent \u2013 Cybersecurity Awareness (FGIV), Security Risk Management & Services Unit","applicationUrl":"https:\/\/emea3.recruitmentplatform.com\/apply-app\/pages\/application-form?jobId=QJ4FK026203F3VBQB8NV4LOD7-1081&langCode=en_GB","restricted":false,"restrictedAnnex":false,"internship":false,"published":1787090400,"deadline":1789595999,"updated":1787136471,"referenceNumber":"Europol\/2026\/CA\/FGIV\/174","body":"<p><em>This selection procedure is intended to establish a reserve list of successful candidates. It is envisaged to start using the reserve list in Q4 2026\/Q1 2027.<\/em><br><em>Europol retains the right to make use of the reserve list to select candidates for similar posts within the organisation, should business needs require so<\/em>.<\/p>\n<p><span style=\"font-size: 24px;\"><strong>1. Organisational context<\/strong><\/span><\/p>\n<p><strong>Organisational setting:<\/strong><br>The post of Senior Agent \u2013 Cybersecurity Awareness is located in the Information Security Team, Corporate Security Department, Governance Directorate.<\/p>\n<p style=\"text-align: justify;\">The Governance Directorate is responsible for supporting and assisting Europol Management and the rest of the organisation by providing advice and maintaining strategic links with relevant EU bodies and law enforcement agencies of the Member States. Maintaining close cooperation with other directorates, particularly on key corporate matters and monitor business planning and performance management, are also among the Directorate\u2019s task. Additionally, the Governance Directorate is responsible to ensure Europol\u2019s physical and information security and business continuity. The Governance Directorate comprises of two Departments, Institutional and Legal Affairs and Corporate Security.<\/p>\n<p style=\"text-align: justify;\">The Corporate Security Department establishes all security measures required to protect the persons present at Europol, the Europol buildings, together with its installations and all Europol information, and to ensure the safe and continual operational functioning of Europol. Furthermore, the Department handles the integral management (planning and monitoring) and realization of housing services and resources.<\/p>\n<p style=\"text-align: justify;\">The Security Risk Management & Services Unit, bringing together all services delivered across the organisation to protect information, enhance organisational resilience, manage crises, provide risk-based assessments and advice to relevant stakeholders and deliver directly related facilities services.<\/p>\n<p>The Information Security Team is responsible for:<\/p>\n<ul>\n<li style=\"text-align: justify;\">Ensuring that Information Security risks are well managed;<\/li>\n<li style=\"text-align: justify;\">Providing assurance in Europol\u2019s Communication and Information Systems;<\/li>\n<li style=\"text-align: justify;\">Monitoring the Cyber Threat Landscape and reporting on current and emerging threats;<\/li>\n<li style=\"text-align: justify;\">Developing and maintaining the information security policy framework;<\/li>\n<li style=\"text-align: justify;\">Ensuring compliance of Information Security measures with applicable legal framework;<\/li>\n<li style=\"text-align: justify;\">Coordinating Training and Awareness on Information Security;<\/li>\n<li style=\"text-align: justify;\">Providing expert advice on Information Security matters to Europol\u2019s management, projects and user community.<\/li>\n<\/ul>\n<p style=\"text-align: justify;\"><strong>Purpose of the post:<\/strong><br>The Senior Agent \u2013 Cybersecurity Awareness contributes to the activities and objectives of the Information Security Team with a primary focus on strengthening cybersecurity awareness. The post holder leads the development, implementation and continues improvement of cybersecurity awareness services, ensuring their development towards increased maturity, effectiveness and organisational relevance. The role focuses on the planning, coordination and implementation of cybersecurity awareness initiatives and projects, by designing, coordinating and delivering risk-based cybersecurity awareness, education and training programmes that enhance cybersecurity culture, knowledge, skills and behaviours among staff and relevant stakeholders.<\/p>\n<p><strong>Reporting lines:<\/strong><br>The incumbent reports to the Head of the Information Security Team.<\/p><p><span style=\"font-size: 24px;\"><strong>2. \u00a0Functions and duties<\/strong><\/span><\/p>\n<p>The incumbent carries out the following main functions and duties:\u00a0<\/p>\n<ul>\n<li style=\"text-align: justify;\">Develop, maintain and continuously improve Europol\u2019s cybersecurity awareness and training programme in line with applicable information security policies, standards, regulatory requirements, organisational risks and current threat landscape;<\/li>\n<li style=\"text-align: justify;\">Design, coordinate and deliver targeted cybersecurity awareness campaigns, training activities, workshops, seminars and engagement initiatives to strengthen cybersecurity knowledge, skills and secure behaviours across Europol;<\/li>\n<li style=\"text-align: justify;\">Develop, update and maintain cybersecurity awareness training materials across a variety of formats;\u00a0<\/li>\n<li style=\"text-align: justify;\">Plan and execute phishing simulation exercises, analyse results and identify training needs to inform campaign priorities;<\/li>\n<li style=\"text-align: justify;\">Collaborate with internal stakeholders to integrate cybersecurity awareness into onboarding, staff development activities and wider organisational security initiatives;<\/li>\n<li style=\"text-align: justify;\">Monitor, evaluate and report on the effectiveness of cybersecurity awareness and training activities using defined metrics, KPIs and assessment methods, providing recommendations to the management;\u00a0<\/li>\n<li style=\"text-align: justify;\">Support the development and maintenance of information security policies, procedures and guidance related to staff cybersecurity responsibilities and human-factor risks;<\/li>\n<li style=\"text-align: justify;\">Assess and support the use of cybersecurity awareness platforms, learning management systems (LMS), content creation tools, multimedia production tools and other technologies supporting awareness activities;<\/li>\n<li style=\"text-align: justify;\">Follow developments in cybersecurity threats, awareness practices and training approaches and contribute to the continuous improvement of awareness activities;<\/li>\n<li style=\"text-align: justify;\">Liaise with EU institutions, agencies, law enforcement partners and relevant external bodies to exchange knowledge and promote cybersecurity awareness best practices;<\/li>\n<li style=\"text-align: justify;\">Perform any other duty in the area of competence as assigned by line management.<\/li>\n<\/ul>\n<p><span style=\"font-size: 24px;\"><strong>3. \u00a0 \u00a0 Requirements - Eligibility criteria<\/strong><\/span><\/p>\n<p><strong>a. \u00a0 \u00a0Candidates must<\/strong><\/p>\n<ul>\n<li style=\"text-align: justify;\">Be a national of one of the Member States of the European Union and enjoy full rights as a citizen;<\/li>\n<li style=\"text-align: justify;\">Have fulfilled any obligations imposed by the applicable laws on military service;<\/li>\n<li style=\"text-align: justify;\">Produce appropriate character references as to his or her suitability for the performance of the duties;<\/li>\n<li style=\"text-align: justify;\">Be physically fit to perform the duties pertaining to the position (prior to appointment the successful candidate will be medically examined by one of the institution\u2019s medical officers in order that the institution may be satisfied that the candidate fulfils the requirements of Article 12(2)(d) of the Conditions of Employment of Other Servants of the European Union (CEOS);<\/li>\n<li style=\"text-align: justify;\">Produce evidence of a thorough knowledge of one of the languages of the Union and a satisfactory knowledge of another language of the Union to the extent necessary for the performance of the duties.<\/li>\n<\/ul><p><strong>b. \u00a0 \u00a0Candidates must have<\/strong><\/p>\n<ul>\n<li>Have a level of education which corresponds to completed university studies attested by a diploma when the normal period of university education is 3 years or more;<br><strong><\/strong><\/li>\n<\/ul>\n<p><strong>OR<\/strong><\/p>\n<ul>\n<li>Professional training of an equivalent level, and after having completed the training, at least the number of years of relevant professional experience as indicated below:<br><strong>Duration of professional training \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0Additional professional experience required \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0\u00a0<\/strong><br>More than 6 months and up to 1 year \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a03 years<br>More than 1 year and up to 2 years \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a02 years<br>More than 2 years \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 1 year<\/li>\n<\/ul>\n<p><span style=\"font-size: 24px;\"><strong>4. \u00a0 \u00a0 Requirements - Selection criteria<\/strong><\/span><\/p>\n<p><strong>a. \u00a0 \u00a0Professional experience:\u00a0<\/strong><br><strong><\/strong><\/p>\n<p><strong>Essential:<\/strong><\/p>\n<ul>\n<li style=\"text-align: justify;\">Experience in planning, designing, developing and implementing cybersecurity awareness, education or security training programmes and\/or campaigns;<\/li>\n<li style=\"text-align: justify;\">Experience in developing cybersecurity awareness content and training materials for diverse audiences, including non-technical users, using different formats;\u00a0<\/li>\n<li style=\"text-align: justify;\">Experience in planning and executing social engineering awareness exercises (e.g. phishing simulations), analysing results and using findings to support behavioural change and risk reduction;<\/li>\n<\/ul>\n<p><strong>Desirable:<\/strong><\/p>\n<ul>\n<li style=\"text-align: justify;\">Experience in working in an international work environment;\u00a0<\/li>\n<li style=\"text-align: justify;\">Experience with e-learning platforms or learning management systems (LMS);<\/li>\n<li style=\"text-align: justify;\">Experience in applying behavioural science, adult learning principles or change management approaches to security awareness activities.<\/li>\n<\/ul>\n<p><strong>b. \u00a0 \u00a0Professional knowledge:\u00a0<\/strong><br><strong><\/strong><\/p>\n<p><strong>Essential:<\/strong><\/p>\n<ul>\n<li style=\"text-align: justify;\">Knowledge of cybersecurity principles, cyber threats and attack vectors, including phishing, social engineering and malware, insider threat and human-factor risks;\u00a0<\/li>\n<li style=\"text-align: justify;\">Knowledge of cybersecurity awareness methodologies, behavioural change principles and best practices;<\/li>\n<li style=\"text-align: justify;\">Ability to develop and produce security awareness materials in different formats; (e.g. graphic content);\u00a0<\/li>\n<li style=\"text-align: justify;\">Knowledge of applicable EU regulatory and policy frameworks for cybersecurity, including Regulation (EU, Euratom) 2023\/2841 (EU Cybersecurity Regulation for Union entities);<\/li>\n<li style=\"text-align: justify;\">Knowledge of metrics and performance measurement techniques used for measuring the effectiveness of cybersecurity awareness initiatives.<\/li>\n<\/ul><p><strong>c. \u00a0 \u00a0General competencies:\u00a0<\/strong><br><strong><\/strong><\/p>\n<p><strong>Essential:<\/strong><br><em>Communicating:<\/em><\/p>\n<ul>\n<li>Very good communication skills in English, both orally and in writing.<\/li>\n<li>Very good drafting skills and attention to detail.\u00a0<br>Analysing & problem solving:<\/li>\n<li>Keen eye for detail with the ability to maintain standards of accuracy under pressure of tight deadlines.<\/li>\n<li>Strong analytical and problem-solving skills including the ability to anticipate potential problems, determine and implement solutions.<\/li>\n<li>Competent user of Microsoft Office applications (MS Word, Excel, PowerPoint and Outlook) and the internet.<\/li>\n<\/ul>\n<p><em>Delivering quality and results:<\/em><\/p>\n<ul>\n<li>High degree of commitment and flexibility.\u00a0<\/li>\n<li>High level of customer and service-orientation.<\/li>\n<\/ul>\n<p><em>Prioritising and organising:<\/em><\/p>\n<ul>\n<li>Good administrative and organisational skills.<\/li>\n<\/ul>\n<p><em>Resilience:<\/em><\/p>\n<ul>\n<li>Ability to work well under pressure, both independently and in a team.<\/li>\n<li>Very good interpersonal skills, including the ability to effectively liaise with other departments, groups and teams as well as with external partners.<\/li>\n<\/ul>\n<p><em>Living diversity:<\/em><\/p>\n<ul>\n<li>Ability to work effectively in an international and multi-cultural environment.<\/li>\n<\/ul>\n<p><span style=\"font-size: 24px;\"><strong>5. \u00a0 \u00a0 Selection procedure<\/strong><\/span><\/p>\n<p style=\"text-align: justify;\"><strong>All applications for Contract Agent posts must be submitted through the online recruitment system accessible via <a href=\"https:\/\/www.europol.europa.eu\/careers-procurement\/open-vacancies#fndtn-tabs-0-bottom-1\">Europol\u2019s website<\/a><\/strong>.<\/p>\n<p style=\"text-align: justify;\">The Authority Authorised to Conclude Contracts of Employment (AACC) sets up a Selection Committee, composed of at least three members, consisting of one chair and at least one member from the Administration of Europol and one member designated by the Staff Committee.<\/p>\n<p style=\"text-align: justify;\">The selection criteria, set out in this Vacancy Notice, will be assessed by the Selection Committee throughout the different stages of the selection procedure. Before the start of the selection procedure, the Selection Committee will decide which selection criteria will be used at each stage of the selection procedure. Certain selection criteria will be assessed only for shortlisted candidates during a written test and\/or a competency-based interview.<\/p>\n<p style=\"text-align: justify;\">The Selection Committee will assess the applications received in order to make an initial selection of those candidates meeting all eligibility criteria and matching best the selection criteria (suitability).\u00a0<\/p>\n<p style=\"text-align: justify;\">The minimum pass-mark for being shortlisted, i.e. invited to participate in a post-related selection procedure, consisting of a written test and a competency-based interview, is established as 60% of the total maximum score.\u00a0<\/p>\n<p style=\"text-align: justify;\">The Selection Committee will shortlist the <strong>6 highest<\/strong> scoring candidates. All candidates having a score equal to the <strong>6th highest<\/strong> scoring candidate will be invited to take part in the selection procedure. At shortlisting stage, the Selection Committee will establish the pass-mark for the selection procedure.<\/p>\n<p style=\"text-align: justify;\">It is intended for the selection procedure to be conducted remotely. Should the Selection Committee consider it necessary to conduct the selection procedure on-site at Europol in the interest of the proceedings, and subject to budget availability, the candidates invited to participate in the selection procedure will be informed accordingly.<\/p><p style=\"text-align: justify;\">After the selection procedure has taken place, the Selection Committee will establish a list of successful candidates, i.e. those scoring above the pre-defined pass-mark, which is shared with the AACC, for establishment of a Reserve list. A Reserve list is valid for 24 months.<\/p>\n<p style=\"text-align: justify;\">Candidates who participated in the interview will be informed of the outcome, i.e. whether they have been successful or not.<\/p>\n<p style=\"text-align: justify;\">The Selection Committee\u2019s work and deliberations are confidential. It is forbidden for candidates to make direct or indirect contact with the members of the Selection Committee or for anyone to do so on their behalf.\u00a0<\/p>\n<p style=\"text-align: justify;\">All enquiries related to a selection procedure should be addressed to the Europol HR Operational Support Team at the following email address: C2-12@europol.europa.eu. Detailed information on the selection procedure- including enquiries, measures of redress and their applicable deadlines is available in the <a href=\"https:\/\/www.europol.europa.eu\/publications-events\/publications\/europol-recruitment-guidelines\">Europol Recruitment Guidelines<\/a>, which can be found on Europol\u2019s website.<\/p>\n<p style=\"text-align: justify;\"><span style=\"font-size: 24px;\"><strong>6. \u00a0 \u00a0 Compensation and benefits<\/strong><\/span><\/p>\n<p>The AACC shall classify contract staff in their function group taking into consideration their qualifications and professional experience at the time of entry into service.<\/p>\n<p><strong>FGIV<\/strong><br>The basic monthly salary is: grade 13 (EUR <strong>4,449.31<\/strong>), grade 14 (EUR <strong>5,034.18<\/strong>) or grade 16 (EUR <strong>6,444.59<\/strong>)<\/p>\n<p><strong>Grade \u00a0 \u00a0Qualifications and professional experience<\/strong><br>13\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 Less than 5 years<br>14\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 Between 5 years and 17 years<br>16\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 More than 17 years<\/p>\n<p style=\"text-align: justify;\">Staff pay EU tax at source but salaries are exempt from national taxes. Compulsory deductions are made for medical insurance, pension and unemployment insurance. \u00a0<\/p>\n<p style=\"text-align: justify;\">Subject to the applicable conditions being met, as defined in the EU Staff Regulations (EUSR)\/CEOS and further specified in the case law of the Court of Justice of the European Union, allowances such as expatriation allowance (16% of basic gross salary) or foreign residence allowance (4% of basic gross salary), household allowance, dependent child and \/ or education allowance may be granted. \u00a0<\/p>\n<p style=\"text-align: justify;\">Staff enjoy worldwide insurance coverage by the Joint Sickness Insurance Scheme (JSIS) and are insured against sickness, the risk of occupational disease and accident.<\/p>\n<p style=\"text-align: justify;\">Europol offers flexible working arrangements, a comprehensive provision for annual leave as well as parental leave supporting a healthy work-life balance.<\/p>\n<p style=\"text-align: justify;\"><strong>Indicative net salary sample calculation:<\/strong><br>a)\u00a0 \u00a0Staff member (single) in receipt of expatriation allowance (16%): grade 13 EUR 4,776.93, grade 14 EUR 5,376.42, grade 16 EUR 6,749.02\u00a0<br>b)\u00a0 Staff member with two dependent children in their custody in receipt of expatriation allowance (16%): grade 13 EUR 6,795.42, grade 14 EUR 7,423.54, grade 16 EUR 8,900.02<\/p>\n<p style=\"text-align: justify;\">The above information is indicative and for information purposes only. It is merely meant to give an indication of your possible net salary in light of the currently applicable amounts of the related allowances and the level of taxation. It has no legal value and no rights can be derived from it.<\/p>\n<p style=\"text-align: justify;\">The information is based on figures applicable as of <strong>July 2025<\/strong>.<\/p><p><span style=\"font-size: 24px;\"><strong>7. \u00a0 \u00a0 Terms and conditions<\/strong><\/span><\/p>\n<p style=\"text-align: justify;\"><strong>Contract of employment<\/strong><br>The successful candidate will be recruited as <strong>Contract Agent FGIV<\/strong> pursuant to Article 3(a) of the CEOS.\u00a0<\/p>\n<p style=\"text-align: justify;\">The initial contract will be concluded for a fixed period of 4 years (full-time \u2013 40 hours a week). <strong>The contract may be renewed, in principle, for a fixed period of 2 years<\/strong>. Any further renewal shall be for an indefinite duration.<\/p>\n<p style=\"text-align: justify;\">In case of successive contracts under Article 3a) of the CEOS, the duration of the contract offered will be set in accordance with the provisions of the Decision of the Management Board of Europol of 4 October 2019 governing the conditions of employment of contract staff employed under the terms of Article 3a) thereof.\u00a0<\/p>\n<p style=\"text-align: justify;\">Before a successful candidate can be engaged on a contract of employment for an indefinite duration in function group IV, in case of successive contracts under Article 3a) of the CEOS, s\/he will have to prove the ability to work in a third language (i.e. one of the official European languages). Specifically, the successful candidate is required to hold an EPSO validated language certificate or diploma of at least level B2 - as referred to in the Council of Europe\u2019s Common European Framework of Reference for Languages.\u00a0<\/p>\n<p style=\"text-align: justify;\"><strong>Conditions of engagement<\/strong><br>Before the employment contract is concluded by Europol, the successful candidate will have to:<\/p>\n<ul style=\"text-align: justify;\">\n<li style=\"text-align: justify;\">declare any conflict of interest;<\/li>\n<li style=\"text-align: justify;\">undergo a pre-employment medical examination to confirm that he\/she is physically fit to perform the duties pertaining to the post or, alternatively, receive the confirmation from Europol that he\/she fulfils the conditions laid down in the Decision of the Deputy Executive Director of the Capabilities Directorate on the <a href=\"https:\/\/www.europol.europa.eu\/publications-events\/publications\/decision-of-deputy-executive-director-of-capabilities-directorate-pre-employment-medical-examination\">pre-employment medical examination<\/a> available on Europol\u2019s website.<\/li>\n<\/ul>\n<p style=\"text-align: justify;\">The place of employment will be The Hague, The Netherlands.\u00a0<\/p>\n<p style=\"text-align: justify;\"><strong>Probation period<\/strong><br>Engagement for this post is subject to the successful completion of a probationary period of 9 months.\u00a0<\/p>\n<p style=\"text-align: justify;\">In case of successive contracts under Article 3a) of the CEOS, a candidate may be exempt from the requirement to serve another probationary period in accordance with the provisions of the Decision of the Management Board of Europol of 4 October 2019 governing the conditions of employment of contract staff employed under the terms of Article 3a) thereof.<\/p>\n<p style=\"text-align: justify;\">Europol reserves the right to terminate the contract of employment during or at the end of the probation period in accordance with Article 84 the CEOS.<\/p><p style=\"text-align: justify;\"><strong>Security screening and certificate of good conduct<\/strong><br>Candidates who have been recruited to a post at Europol are required to furnish a valid certificate of good conduct before the start of their employment. The certificate of good conduct must be provided to Europol prior to the signature of the employment contract. The certificate of good conduct must be issued by the relevant authorities of the country of nationality of the candidate and must not be older than three months at the time of submission to Europol. Europol reserves the right not to proceed with the signature of the contract based on the content of the certificate or if the candidate fails to provide the certificate to Europol.\u00a0<\/p>\n<p style=\"text-align: justify;\">The certificate of good conduct does not substitute a valid security clearance required for all Europol staff at the level indicated in the vacancy notice. Failure to obtain the requisite security clearance may be cause for termination of the employment contract.<\/p>\n<p style=\"text-align: justify;\">Candidates who currently hold a valid security clearance at the level indicated in the vacancy notice or above do not need to obtain a certificate of good conduct or a new security clearance and must provide a copy of the current security clearance certificate to Europol prior to the signature of the employment contract. Europol shall verify and confirm the continued validity of the security clearance. In case Europol determines that the security clearance is not valid, the candidate will be required to provide a valid certificate of good conduct prior to the signature of the employment contract. Europol may at any time terminate the employment contract if the result of the security screening is not positive and the necessary clearance level is not granted or extended.\u00a0<\/p>\n<p style=\"text-align: justify;\">The requested level of security clearance for this post is: <strong>CONFIDENTIEL UE\/EU CONFIDENTIAL\u00a0<\/strong><\/p>\n<p style=\"text-align: justify;\">For further information on terms and conditions, please consult the <a href=\"https:\/\/www.europol.europa.eu\/publications-events\/publications\/staff-regulations-of-officials-of-european-union-eusr-and-conditions-of-employment-of-other-servants-of-european-union-ceos\">EUSR\/CEOS<\/a> available on Europol\u2019s website.<\/p>\n<p><span style=\"font-size: 24px;\"><strong>8. \u00a0 \u00a0 Additional information<\/strong><\/span><\/p>\n<p style=\"text-align: justify;\"><strong>Equal opportunity<\/strong><br>Europol is an equal opportunity employer. Europol accepts applications without distinction on grounds of gender, sexual orientation, national, ethnic or social origin, religion or beliefs, family situation, age, disability, or other non-merit factors. All employment decisions are based on business needs, job requirements and qualifications, experience and skills.<\/p>\n<p style=\"text-align: justify;\">Europol lives diversity and provides an inclusive work environment to all. Europol strives to recruit, develop and retain a diverse and talented workforce through application of equal opportunity and impartiality.<\/p><p style=\"text-align: justify;\"><strong>Privacy Notice<\/strong><br>Regulation (EU) 2018\/1725 of the European Parliament and of the Council of 23 October 2018 on the protection of natural persons with regard to the processing of personal data by the Union institutions, bodies, offices and agencies and on the free movement of such data, and repealing Regulation (EC) No 45\/2001 and Decision No 1247\/2002\/EC, applies to the processing of personal data carried out in the process of selection and recruitment of staff at Europol, following the application of this Regulation to all administrative personal data held by Europol in accordance with Article 27a of the Europol Regulation.<\/p>\n<p style=\"text-align: justify;\">For additional information, please consult the applicable <a href=\"https:\/\/www.europol.europa.eu\/careers-procurement\/privacy-statement\">privacy notice<\/a> available on Europol\u2019s website, also inserted in the Europol Recruitment Guidelines.\u00a0<\/p>\n<p style=\"text-align: justify;\"><strong>Statutory obligations upon leaving the service<\/strong><br>Pursuant to Article 16 of the EUSR, EU officials and, by analogy, contract agents continue to be bound by the duty to behave with integrity and discretion as regards the acceptance of certain appointments or benefits after leaving the service. Those staff members intending to engage in an occupational activity within two years of leaving the service shall inform their institution, so that it may take an appropriate decision in that respect. In cases where the intended activity is related to the work carried out by the staff member during the last three years of service and could lead to a conflict with the legitimate interests of the institution, the decision to be taken may include forbidding the staff member from undertaking it or giving its approval subject to any conditions it thinks fit.<\/p>\n<p style=\"text-align: justify;\"><strong>Main dates<\/strong><br>Publication date:\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0<strong>19 August 2026<\/strong><br>Deadline for application: <strong>16 September 2026, 23:59 Amsterdam Time Zone<\/strong><br>Recruitment procedure:\u00a0 \u00a0<strong>October\/November 2026<\/strong><\/p>\n<p style=\"text-align: justify;\"><strong>Application process and selection procedure<\/strong> \u00a0 \u00a0<br>For further details on the application process and the selection procedure, please consult our <a href=\"https:\/\/www.europol.europa.eu\/faq?c=546\">FAQs<\/a> or refer to the <a href=\"https:\/\/www.europol.europa.eu\/publications-events\/publications\/europol-recruitment-guidelines\">Europol Recruitment Guidelines<\/a> available on Europol\u2019s website.<\/p>\n<p style=\"text-align: justify;\"><strong>Contact details<\/strong><br>For further details on the application process please call <strong>+31 (0) 70 353 1981<\/strong> or <strong>+31 (0)70 353 1146<\/strong>.<\/p>","reportTo":"Head of the Information Security Team","contractTypeGroup":"Contract Agents","contractType":"Contract Agent","postType":"Non-Restricted","department":"G5 Corporate Security","alias":"\/work-with-us\/careers\/open-vacancies\/vacancy\/1081"}}};</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","@id":"https://www.europol.europa.eu/#organization","name":"Europol","url":"https://www.europol.europa.eu","logo":"https://www.europol.europa.eu/logo-share.png"}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","@id":"https://www.europol.europa.eu/#website","url":"https://www.europol.europa.eu","name":"Europol","publisher":{"@id":"https://www.europol.europa.eu/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","@id":"https://www.europol.europa.
