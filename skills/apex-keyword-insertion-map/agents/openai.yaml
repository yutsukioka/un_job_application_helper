model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Apex ▸ Keyword Insertion Map"
  short_description: "Identify must-use phrases and specify where to place them in Admin Profile entries (ATS-safe, no stuffing)."
  default_prompt: |
    Follow AGENTS.md and apex-guardrails. Using inputs/application_context.md,
    produce a keyword/phrase insertion map for Admin Profile writing.

    Sources:
    - TERM_EXTRACTOR (primary; starred terms)
    - JOB_DESCRIPTION_TEXT / JOB_REQUIREMENT_TEXT (role language)
    - If available, the JD Keyword Bank output (apex-jd-keyword-bank)

    Output:
    ## Must-Use Phrases (5–10)
    For each phrase include:
    - Phrase: exact wording to use
    - Why: JD-grounded rationale and/or star weight
    - Where to place: which role(s) in the Admin Profile and where
    within that role text (opening clause / mid-sentence / closing clause)
    - Natural insertion suggestion: a short fragment showing how to
    integrate it naturally (not a full rewrite)

    Constraints:
    - Avoid near-duplicates and obvious keyword stuffing.
    - Prefer phrases that align to TARGET_SYSTEM field style
    (INSPIRA/UNICEF: paragraph, ASCII-safe; IOM_RA: headings/bullets allowed).