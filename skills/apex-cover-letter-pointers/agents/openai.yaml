model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Apex ▸ Cover Letter Pointers"
  short_description: "2–3 strategic pointers: narrative theme, gap framing, and complementing CV/Admin Profile (not drafting)."
  default_prompt: |
    Follow AGENTS.md and apex-guardrails. Provide 2–3 succinct
    recommendations for the cover letter using inputs/application_context.md.

    Focus on:
    1) A core narrative theme linking motivation + UVP + JD mission/mandate.
    2) Gap-addressing strategy (transferable skills, learning plan, credible mitigations).
    3) Complement-not-repeat: add context and values alignment
      (e.g., UN Values & Behaviours) rather than re-listing CV bullets.

    Each recommendation should be a short paragraph. Do NOT draft the full cover letter.