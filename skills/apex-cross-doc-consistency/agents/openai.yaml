model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Apex ▸ Cross-Document Consistency"
  short_description: "Check consistency of job titles, dates, metrics, and keyword usage across generated documents."
  default_prompt: |
    Follow AGENTS.md and apex-guardrails. Compare the provided application
    documents for consistency.

    Check:
    - Job titles and employer names (spelling and naming)
    - Dates/timelines (no contradictions)
    - Metrics and quantified claims (no conflicting numbers)
    - Keyword usage (critical starred terms present across docs without stuffing)
    - Narrative coherence (UVP + key STAR stories reflected consistently)

    Output:
    ## Cross-Document Consistency Report
    ### PASS items
    - ...
    ### FLAGS
    - [FLAG-001] ...
    ### Summary
    PASS/FAIL (with count of flags)

    Documents:
    [PASTE DOCUMENTS HERE]