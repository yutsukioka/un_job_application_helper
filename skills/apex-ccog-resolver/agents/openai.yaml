model: GPT-5.4
quality: Extra High
interface:
  display_name: "Apex ▸ CCOG Resolver"
  short_description: "Resolve a JD-only, vacancy-specific CCOG subset and write ccog_reference_resolved.md."
  default_prompt: |
    Follow AGENTS.md, apex-guardrails, and apex-ccog-resolver/SKILL.md.

    Objective:
    - Resolve a compact, vacancy-specific CCOG reference subset.
    - Score against JOB_DESCRIPTION_TEXT / JOB_REQUIREMENT_TEXT and the confirmed
      vacancy-context classification only.
    - Do NOT use candidate history in resolver scoring.

    Preconditions:
    - If the vacancy context is not yet confirmed or overridden, stop and ask for
      confirmation first.
    - If the full CCOG resource file is missing or still a stub/template, stop and
      report that production resolution cannot proceed.

    Preferred execution:
    - If filesystem access is available, run:
      `.agents/skills/apex-ccog-resolver/scripts/resolve_ccog.py`
      with `inputs/application_context.md` and write
      `output/ccog_reference_resolved.md`.
    - If filesystem access is not available, follow the same scoring logic and
      produce the same Markdown structure in chat.

    Output requirements:
    - Vacancy title
    - Confirmed vacancy type
    - Total entries
    - Primary family
    - Secondary families
    - Grouped entries by register cluster

    Never merge candidate-side vocabulary into the resolved target register.
