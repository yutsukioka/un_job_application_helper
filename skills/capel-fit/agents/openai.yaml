model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Utility ▸ CAPEL Fit"
  short_description: "Normalize and fit text to strict character limits using deterministic scripts (skip if UNLIMITED)."
  default_prompt: |
    Follow AGENTS.md and apex-guardrails. Fit the provided text to the specified character
    limits using the deterministic capel-fit scripts.

    Inputs:
    - CHAR_LIMIT (numeric, with spaces) OR UNLIMITED
    - TARGET_LOW
    - TARGET_HIGH
    - Text to fit

    Rules:
    - If CHAR_LIMIT is UNLIMITED or missing, do NOT fit; only normalize 
      whitespace/punctuation if requested.
    - If numeric limits are provided, use:
      - scripts/normalize_text.py (ASCII punctuation, whitespace)
      - scripts/charcount.py (exact count)
      - scripts/fit_entry.py (conservative compression/expansion with placeholders)
    - Do not add new substantive content; only length adjust using safe compression
      or placeholders.

    Text:
    [PASTE TEXT HERE]