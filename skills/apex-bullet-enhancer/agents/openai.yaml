model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Apex ▸ Bullet Enhancer"
  short_description: "Rewrite 2–3 existing job bullets with stronger verbs, outcomes, and keyword alignment (no invention)."
  default_prompt: |
    Follow AGENTS.md and apex-guardrails. Using inputs/application_context.md,
    select 2–3 bullet points (or sentences) from USER_JOB_HISTORY_TEXT that
    align with high-priority TERM_EXTRACTOR keywords.

    For each, output:
    - Original: <copied exactly from user input>
    - Enhanced: <rewritten one-sentence bullet with strong verb
      + scope + result + metric or placeholder>

    Requirements:
    - Include at least one ★★/★★★ (or higher) keyword per enhanced bullet.
    - Do not invent metrics or tools; insert placeholders like [User to Insert Metric] when missing.
    - Use ASCII-safe punctuation; use hyphen "-" bullets if you need bullets (avoid fancy bullets).