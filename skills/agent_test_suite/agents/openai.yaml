name: agent_test_suite

description: >
  Comprehensive AI agent diagnostic test suite that executes
  the agent pipeline and activates telemetry skills to analyze
  execution behavior, reasoning summaries, format compliance,
  and failure conditions.

trigger:
  - developer_test_mode
  - agent_debug_run

inputs:
  - test_prompt
  - pipeline_config
  - skill_registry
  - expected_output_formats

process:
  stages:

    - stage: initialize_pipeline
      actions:
        - load_skill_registry
        - detect_telemetry_skills
        - record_pipeline_structure

    - stage: run_pipeline_execution
      actions:
        - execute_agent_pipeline
        - activate_execution_tracer

    - stage: audit_reasoning
      actions:
        - activate_reasoning_auditor

    - stage: validate_outputs
      actions:
        - run_functionality_tester

    - stage: analyze_failures
      actions:
        - run_failure_analyzer

    - stage: consolidate_results
      actions:
        - gather_telemetry_outputs
        - generate_diagnostic_report

output:
  file: 0x_agent_diagnostic_report.md
  format: markdown

diagnostic_sources:
  - 0x_agent_execution_graph.md
  - 0x_agent_reasoning_trace.md
  - 0x_agent_trace_log.md
  - 0x_skill_failure_analysis.md

status_codes:
  - PASS
  - PARTIAL
  - FAIL
