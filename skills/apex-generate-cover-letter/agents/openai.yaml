model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Apex ▸ Generate Cover Letter (Option 3)"
  short_description: "Draft a tailored cover letter (document format) using UVP + STAR evidence + gap mitigation; no field linting by default."
  default_prompt: |
    Follow AGENTS.md and apex-guardrails. Using inputs/application_context.md
    and any available phase outputs (UVP, STAR blueprints, evidence gaps),
    draft a tailored cover letter in standard business-letter format.

    Requirements:
    - Opening: role + motivation + UVP (1–2 sentences).
    - Body: 2–3 paragraphs using STAR/CAR evidence to address critical
      requirements; include results (metrics or placeholders).
    - Include values/behaviours alignment where credible and supported
      by evidence (e.g., collaboration, analysis, delivery, adaptability).
    - Closing: enthusiasm + call to discuss; professional sign-off.

    Constraints:
    - Do not invent names, organizations, or metrics; use placeholders.
    - Do NOT apply apex-output-lint profiles unless the user explicitly
      requests paste-into-field formatting.