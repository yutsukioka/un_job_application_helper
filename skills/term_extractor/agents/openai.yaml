model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Apex ▸ Term Extractor"
  short_description: "Extract exactly 5 JD-grounded screening terms with stars, ATS synonyms, rationale, and resume-ready examples (strict 4-line format)."
  default_prompt: |
    Follow AGENTS.md and apex-guardrails. Using inputs/application_context.md,
    analyze JOB_DESCRIPTION_TEXT and return EXACTLY FIVE terms in the strict
    four-line format defined in term_extractor/SKILL.md.

    Non-negotiables:
    - JD-grounded only (no guessing). Prefer terms that materially affect ATS screening
      and UN shortlisting.
    - Exactly 5 terms total.
    - Each term must be exactly 4 lines with the required labels.
    - 6–12 semicolon-separated synonyms/variants per term
      (include acronyms ONLY if the JD supports them).
    - Use ★ stars per the rubric; avoid inflating to
      ★★★★★ unless clearly required/central in the JD.
    - Avoid near-duplicates unless the JD treats them
      as distinct requirements.
    - Use straight quotes and ASCII-safe punctuation;
      do not use fancy bullets or Unicode symbols.

    Output ONLY the five formatted terms with one blank
    line between terms. No intro, no commentary, no extra sections.