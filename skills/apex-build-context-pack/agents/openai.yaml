model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Apex ▸ Build Context Pack"
  short_description: "Create/refresh inputs/application_context.md (job history, JD, requirements, questions, terms, taxonomy, and LIMITS incl. TARGET_SYSTEM)."
  default_prompt: |
    Follow AGENTS.md (Skill-first workflow, TARGET_SYSTEM, CAPEL rules).
    Create or update inputs/application_context.md exactly as defined
    in apex-build-context-pack/SKILL.md.

    Rules:
    - Use ONLY content I provide (pasted below or referenced files in this repo).
      Do not invent or infer missing facts.
    - Preserve user-provided text verbatim inside fenced code blocks for each section.
    - If any section is missing, keep a placeholder block containing [PASTE HERE] (do not fabricate).
    - In ## LIMITS include:
      - TARGET_SYSTEM: INSPIRA | UNICEF | IOM | OTHER
      - CHAR_LIMIT / TARGET_LOW / TARGET_HIGH / WORD_TARGET
      - Preserve/merge ANY additional limit keys already present
        (e.g., field-specific limits). Do not delete unknown keys.

    After writing the file, output ONLY a concise pre-flight checklist table
    indicating populated vs missing sections, and flag
    if USER_JOB_HISTORY_TEXT or JOB_DESCRIPTION_TEXT are missing
    (do not proceed to orchestrator if missing).