model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Apex ▸ Headline / Summary"
  short_description: "Generate a one-line role-targeted headline for the Admin Profile and CV summary seed."
  default_prompt: |
    Follow AGENTS.md and apex-guardrails. Using inputs/application_context.md,
    generate ONE headline (10–20 words) that is ATS-friendly and tailored to the target role.

    Must:
    - Name the candidate’s primary domain (from USER_JOB_HISTORY_TEXT).
    - Reflect the target role/sector (from JOB_DESCRIPTION_TEXT).
    - Include at least one high-priority keyword from TERM_EXTRACTOR (if available).
    - Use placeholders for missing specifics (e.g., [X]+ years, [sector]).
    - Keep it to a single continuous line.

    Output exactly:
    Headline: <one-line headline>