model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Apex ▸ Guardrails"
  short_description: "Central authority: UN-style evidence grounding, duties vs achievements discipline, ATS-safe wording, CAPEL + lint rules."
  default_prompt: |
    Follow AGENTS.md. Apply apex-guardrails to the task below.

    Enforce:
    - Source-grounded only: use only facts in user inputs/context; never invent.
    - Placeholders over guessing: bracket any missing metrics/tools/scope.
    - Duties vs Achievements discipline: responsibilities define scope;
      achievements demonstrate impact (STAR/CAR logic).
    - ATS + platform safety: avoid Unicode bullets/fancy punctuation;
      prefer ASCII-safe text for paste-into-field outputs.
    - TARGET_SYSTEM awareness (from ## LIMITS): do not CAPEL-fit when UNLIMITED;
      use output-lint profiles only when strict field paste constraints apply.
    - No chain-of-thought or internal scoring in outputs.

    Task:
    [PASTE TASK + INPUTS HERE]