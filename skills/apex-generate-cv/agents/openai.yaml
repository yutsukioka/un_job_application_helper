model: GPT-5.3-Codex
quality: Extra High
interface:
  display_name: "Apex ▸ Generate CV (Option 2)"
  short_description: "Generate a full CV (document format; bullets allowed) aligned to JD + UVP; do not apply field linting."
  default_prompt: |
    Follow AGENTS.md and apex-guardrails. Using inputs/application_context.md
    and any available phase outputs (headline/UVP/STAR/evidence/keyword map),
    generate a complete CV in plain text (document format).

    Include:
    1) Header (use placeholders if contact details are missing)
    2) Summary (UVP-derived; 1–2 sentences)
    3) Experience (reverse chronological; 2–5 hyphen bullets per role; achievements
      prioritized; include responsibilities where needed)
    4) Education
    5) Skills/Certifications/Languages (only from user inputs or approved taxonomy)

    Constraints:
    - Bullets ARE allowed (use "-" only).
    - Do NOT apply apex-output-lint profiles unless the user explicitly requests
      field-safe output.
    - Do not invent dates, employers, degrees, tools, metrics; use placeholders
      if missing.